<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outbound Agent</title>
  <meta name="description" content="Describe your ideal customer. An AI agent researches companies, scores fit and drafts outreach for you to approve. Drafts only, nothing is sent.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f54eb'/%3E%3Cpath d='M9 17l5-9 9 7-6 1-2 7z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Main">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 17l5-9 9 7-6 1-2 7z" fill="currentColor"/></svg></span>
        <span class="brand-name">Outbound Agent</span>
      </div>

      <nav class="steps" id="steps" aria-label="Steps"></nav>

      <div class="side-section">
        <div class="side-label">Runs</div>
        <div id="run-list" class="run-list"></div>
      </div>

      <div class="side-foot">
        <div class="safe-note">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
          <span><strong>Drafts only.</strong> Nothing is sent.</span>
        </div>
        <a class="side-link" href="https://github.com/techi101/ai-outbound-agent" target="_blank" rel="noopener">Source code on GitHub</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumb" id="crumb"></div>
        <div class="top-right">
          <span class="pill pill-brand" id="run-pill"></span>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Draft"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
